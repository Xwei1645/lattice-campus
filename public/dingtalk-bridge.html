<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>钉钉登录 - 处理中</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #f5f5f5;
            min-height: 100vh;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            text-align: center;
            background-color: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
        }
        .title {
            font-size: 20px;
            color: #333;
            margin-bottom: 12px;
            font-weight: 600;
        }
        .status {
            font-size: 14px;
            color: #666;
            margin-bottom: 24px;
            line-height: 1.6;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #f3f3f3;
            border-top-color: #0052d9;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .success-icon {
            width: 60px;
            height: 60px;
            background-color: #52c41a;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 32px;
            color: white;
        }
        .error-icon {
            width: 60px;
            height: 60px;
            background-color: #ff4d4f;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 32px;
            color: white;
        }
        .close-btn {
            background-color: #0052d9;
            color: white;
            border: none;
            padding: 12px 32px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            margin-top: 16px;
        }
        .close-btn:hover {
            background-color: #0043b5;
        }
        .error-message {
            color: #ff4d4f;
            font-size: 13px;
            margin-top: 8px;
            padding: 8px;
            background-color: #fff2f0;
            border-radius: 4px;
        }
        .login-btn {
            background-color: #0052d9;
            color: white;
            border: none;
            padding: 12px 32px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            margin-top: 16px;
            text-decoration: none;
            display: inline-block;
        }
        .login-btn:hover {
            background-color: #0043b5;
        }
    </style>
</head>
<body>
    <div class="container" id="container">
        <div class="spinner" id="spinner"></div>
        <div class="title" id="title">正在处理...</div>
        <div class="status" id="status">请稍候</div>
        <div id="error-container"></div>
        <button class="close-btn" id="closeBtn" style="display: none;" onclick="closeWindow()">关闭窗口</button>
    </div>

    <script>
        // 获取 URL 参数
        const urlParams = new URLSearchParams(window.location.search);
        const authCode = urlParams.get('code') || urlParams.get('authCode');
        const state = urlParams.get('state') || '';
        const error = urlParams.get('error');
        const errorDescription = urlParams.get('error_description') || '';

        // 关闭窗口
        function closeWindow() {
            window.close();
        }

        // 显示成功状态
        function showSuccess(user) {
            document.getElementById('spinner').style.display = 'none';
            document.getElementById('title').textContent = '登录成功';
            document.getElementById('status').textContent = '正在返回主页面...';
            
            // 插入成功图标
            const container = document.getElementById('container');
            const icon = document.createElement('div');
            icon.className = 'success-icon';
            icon.innerHTML = '✓';
            container.insertBefore(icon, document.getElementById('title'));

            // 通知父窗口
            if (window.opener && window.opener !== window) {
                window.opener.postMessage({
                    type: 'dingtalk_bridge_result',
                    success: true,
                    user: user
                }, '*');
            }

            // 2秒后自动关闭
            setTimeout(closeWindow, 2000);
        }

        // 显示错误状态
        function showError(errorCode, message) {
            document.getElementById('spinner').style.display = 'none';
            document.getElementById('title').textContent = '登录失败';
            document.getElementById('status').textContent = message || '登录过程中出现错误';
            document.getElementById('closeBtn').style.display = 'inline-block';
            
            // 插入错误图标
            const container = document.getElementById('container');
            const icon = document.createElement('div');
            icon.className = 'error-icon';
            icon.innerHTML = '✕';
            container.insertBefore(icon, document.getElementById('title'));

            // 显示详细错误信息
            if (message) {
                const errorContainer = document.getElementById('error-container');
                errorContainer.innerHTML = '<div class="error-message">' + message + '</div>';
            }

            // 通知父窗口
            if (window.opener && window.opener !== window) {
                window.opener.postMessage({
                    type: 'dingtalk_bridge_result',
                    success: false,
                    error: errorCode,
                    message: message
                }, '*');
            }
        }

        // 跳转到钉钉授权页面
        function redirectToDingtalk() {
            const state = Date.now().toString();
            const redirectUri = encodeURIComponent(window.location.origin + '/dingtalk-bridge.html');
            const clientId = 'dingunoyfk9qapdz4bry'; // 从环境变量或配置中获取
            const dingtalkUrl = `https://login.dingtalk.com/oauth2/auth?role=user&client_id=${clientId}&redirect_uri=${redirectUri}&response_type=code&scope=openid%20corpid&state=${state}&prompt=consent`;
            window.location.href = dingtalkUrl;
        }

        // 处理登录
        async function processLogin() {
            // 如果有错误参数，显示错误
            if (error) {
                showError(error, errorDescription || '授权失败');
                return;
            }

            // 如果没有授权码，跳转到钉钉授权页面
            if (!authCode) {
                document.getElementById('status').textContent = '正在跳转到钉钉授权页面...';
                setTimeout(redirectToDingtalk, 500);
                return;
            }

            // 有授权码，调用后端 API 处理登录
            document.getElementById('status').textContent = '正在验证身份信息...';
            
            try {
                // 调用后端 API 处理登录
                const response = await fetch('/api/auth/dingtalk/callback?authCode=' + encodeURIComponent(authCode) + '&state=' + encodeURIComponent(state) + '&bridge=true', {
                    credentials: 'include'
                });
                const data = await response.json();

                if (data.success) {
                    showSuccess(data.user);
                } else {
                    showError(data.error, data.message);
                }
            } catch (err) {
                console.error('Login error:', err);
                showError('network_error', '网络错误，请检查网络连接后重试');
            }
        }

        // 页面加载完成后处理
        window.onload = processLogin;
    </script>
</body>
</html>
